[project]
name = "acc-metrics"
version = "0.2.0"
description = "Auction Competitive Capacity metrics for second-price auctions"
readme = "README.md"
authors = [{ name = "Durmus Karatay", email = "durmus@karatay.me" }]
license = { text = "MIT" }
keywords = ["auctions", "competitive-metrics", "acc", "econometrics", "auction-theory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.14"

dependencies = [
    "numpy>=2.4.6",
    "polars>=1.41.2",
    "scipy>=1.18.0",
    "seaborn>=0.13",
    "matplotlib>=3.11.0",
    "sympy>=1.14.0",
    "joblib>=1.3",
    "numba>=0.65.1",
    "scikit-learn>=1.9.0",
    "openpyxl>=3.1.5",
]

[project.urls]
Repository = "https://github.com/ukaratay/acc"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
    "ruff>=0.15.18",
    "ty>=0.0.51",
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acc_metrics"]

# --- Ruff ---
[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "NPY",    # numpy
    "PTH",    # pathlib
]

[tool.ruff.lint.isort]
known-first-party = ["acc_metrics"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --color=yes"

# --- Coverage ---
[tool.coverage.run]
source = ["acc_metrics"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# --- Ty ---
[tool.ty.environment]
root = ["src", "tests"]

[tool.ty.rules]
# numba's prange and the float|ndarray return unions of the batch API are
# known typing friction; ty 0.0.44 flags them as errors. Keep them visible
# as warnings without failing CI. Revisit as ty and numba stubs mature.
not-iterable = "warn"
not-subscriptable = "warn"

[tool.ty.src]
include = ["src", "tests"]
